<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MagmaSoft – Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="topbar-placeholder"></div>
<div class="app-shell">
  <div id="sidebar-placeholder"></div>
  <main class="main-content" id="main">
    <div class="page-header">
      <div>
        <div class="page-title">Panel Principal</div>
        <div class="page-subtitle">Bienvenido, <span class="js-user-name">Juan Felipe</span> · <span id="today-date"></span></div>
      </div>
      <a href="pages/pedidos.html" class="btn btn-primary">+ Nuevo Pedido</a>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- Main grid -->
    <div class="grid-2" style="gap:1.2rem;">
      <!-- Recent orders -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">📋 Últimos Pedidos</span>
          <a href="pages/pedidos.html" class="btn btn-secondary btn-sm">Ver todos</a>
        </div>
        <div class="table-wrap">
          <table id="dash-orders-table">
            <thead><tr><th>N° Orden</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody id="dash-orders-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Notifications + Low stock -->
      <div style="display:flex;flex-direction:column;gap:1rem;">
        <div class="card">
          <div class="card-header">
            <span class="card-title">🔔 Notificaciones Recientes</span>
            <a href="pages/notificaciones.html" class="btn btn-secondary btn-sm">Ver todas</a>
          </div>
          <div class="card-body" id="dash-notif-list" style="padding:.5rem 0;"></div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">⚠️ Alertas de Inventario</span>
            <a href="pages/inventario.html" class="btn btn-secondary btn-sm">Gestionar</a>
          </div>
          <div class="card-body" id="dash-inventory-alerts" style="padding:.5rem 0;"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="bottom-nav-placeholder"></div>

<script src="js/app.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Date
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('es-CO', {weekday:'long',year:'numeric',month:'long',day:'numeric'});

  // KPIs
  const inProcess = MAGMA.orders.filter(o=>o.status==='En Proceso').length;
  const lowStock  = MAGMA.products.filter(p=>p.stock<p.min).length;
  const unreadN   = MAGMA.notifications.filter(n=>!n.read).length;
  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">Pedidos Totales</div><div class="kpi-value">${MAGMA.orders.length}</div><div class="kpi-sub">Este mes</div></div>
    <div class="kpi-card kpi-green"><div class="kpi-label">En Proceso</div><div class="kpi-value">${inProcess}</div><div class="kpi-sub">En preparación</div></div>
    <div class="kpi-card kpi-orange"><div class="kpi-label">Stock Bajo</div><div class="kpi-value">${lowStock}</div><div class="kpi-sub">Productos críticos</div></div>
    <div class="kpi-card kpi-red"><div class="kpi-label">Notificaciones</div><div class="kpi-value">${unreadN}</div><div class="kpi-sub">Sin leer</div></div>
  `;

  // Recent orders (last 5)
  document.getElementById('dash-orders-body').innerHTML = MAGMA.orders.slice(0,5).map(o=>`
    <tr>
      <td><a href="pages/pedidos.html" class="fw-bold">${o.id}</a></td>
      <td>${o.client}</td>
      <td class="fw-bold">${fmtMoney(o.total)}</td>
      <td>${statusChip(o.status)}</td>
    </tr>`).join('');

  // Notifications
  document.getElementById('dash-notif-list').innerHTML = MAGMA.notifications.map(n=>`
    <div style="display:flex;gap:.6rem;padding:.55rem 1rem;border-bottom:1px solid #f5f5f5;align-items:flex-start;${n.read?'opacity:.5':''}">
      <span>${n.type==='warning'?'⚠️':n.type==='success'?'✅':'ℹ️'}</span>
      <div>
        <div class="text-sm">${n.msg}</div>
        <div class="text-sm text-muted">${n.time}</div>
      </div>
    </div>`).join('');

  // Inventory alerts
  const alerts = MAGMA.products.filter(p=>p.stock<p.min);
  document.getElementById('dash-inventory-alerts').innerHTML = alerts.length === 0
    ? '<div class="text-sm text-muted" style="padding:.7rem 1rem;">Sin alertas de inventario</div>'
    : alerts.map(p=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;border-bottom:1px solid #f5f5f5;">
        <div>
          <div class="text-sm fw-bold">${p.name}</div>
          <div class="text-sm ${stockClass(p)}">${stockLabel(p)} · mín: ${p.min}</div>
        </div>
        ${progressBar(p)}
      </div>`).join('');
});
</script>
</body>
</html>

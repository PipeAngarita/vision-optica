<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MagmaSoft – Catálogo de Productos</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="topbar-placeholder"></div>
<div class="app-shell">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Catálogo de Productos</div>
        <div class="page-subtitle" id="prod-count">Cargando...</div>
      </div>
      <button class="btn btn-primary" onclick="openModal('modal-add-prod')">+ Agregar Producto</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-prod" class="form-control search-input" placeholder="Buscar por nombre, marca, SKU...">
      </div>
      <select id="sort-prod" class="form-control" style="width:auto;">
        <option value="">Ordenar por...</option>
        <option value="price-asc">Precio ↑</option>
        <option value="price-desc">Precio ↓</option>
        <option value="stock-asc">Stock ↑</option>
        <option value="name">Nombre A–Z</option>
      </select>
    </div>

    <!-- Category tabs -->
    <div class="filter-tabs" id="cat-tabs"></div>

    <!-- Product grid -->
    <div class="product-grid" id="product-grid"></div>
    <div id="no-results" class="hidden" style="text-align:center;padding:3rem;color:#aaa;">
      <div style="font-size:2rem;margin-bottom:.5rem;">🔍</div>
      <div>No se encontraron productos con ese criterio.</div>
    </div>
  </main>
</div>
<div id="bottom-nav-placeholder"></div>

<!-- MODAL: Add/Edit Product -->
<div class="modal-overlay" id="modal-add-prod">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-prod-title">Agregar Producto</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nombre del Producto *</label>
          <input type="text" id="prod-name" class="form-control" placeholder="Ej: Montura Ray-Ban">
        </div>
        <div class="form-group">
          <label class="form-label">SKU *</label>
          <input type="text" id="prod-sku" class="form-control" placeholder="Ej: RB3025">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Marca</label>
          <input type="text" id="prod-brand" class="form-control" placeholder="Ej: Ray-Ban">
        </div>
        <div class="form-group">
          <label class="form-label">Categoría *</label>
          <select id="prod-cat" class="form-control">
            <option value="">Seleccionar...</option>
            <option>Gafas de Sol</option>
            <option>Gafas Formuladas</option>
            <option>Deportivas</option>
            <option>Lentes de Contacto</option>
            <option>Accesorios</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Precio de Venta (COP) *</label>
          <input type="number" id="prod-price" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Stock Inicial</label>
          <input type="number" id="prod-stock" class="form-control" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea id="prod-desc" class="form-control" rows="3" placeholder="Descripción del producto..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-prod')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProduct()">Guardar Producto</button>
    </div>
  </div>
</div>

<!-- MODAL: Product Detail -->
<div class="modal-overlay" id="modal-prod-detail">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Detalle del Producto</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-prod-detail')">Cerrar</button>
      <button class="btn btn-primary" onclick="closeModal('modal-prod-detail');openModal('modal-add-prod')">Editar</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/components.js"></script>
<script>
let currentCat = 'Todos';
let currentSearch = '';
let currentSort = '';

function renderCats() {
  document.getElementById('cat-tabs').innerHTML = MAGMA.categories.map(c=>`
    <div class="filter-tab ${c===currentCat?'active':''}" onclick="selectCat('${c}')">${c}</div>`).join('');
}

function selectCat(cat) {
  currentCat = cat;
  renderCats();
  renderProducts();
}

function renderProducts() {
  let list = [...MAGMA.products];
  if (currentCat !== 'Todos') list = list.filter(p=>p.cat===currentCat);
  if (currentSearch) list = filterList(list, currentSearch, ['name','brand','sku','cat']);
  if (currentSort === 'price-asc')  list.sort((a,b)=>a.price-b.price);
  if (currentSort === 'price-desc') list.sort((a,b)=>b.price-a.price);
  if (currentSort === 'stock-asc')  list.sort((a,b)=>a.stock-b.stock);
  if (currentSort === 'name')       list.sort((a,b)=>a.name.localeCompare(b.name));

  document.getElementById('prod-count').textContent = `${list.length} producto${list.length!==1?'s':''} encontrado${list.length!==1?'s':''}`;
  const grid = document.getElementById('product-grid');
  const noRes = document.getElementById('no-results');

  if (!list.length) { grid.innerHTML=''; noRes.classList.remove('hidden'); return; }
  noRes.classList.add('hidden');
  grid.innerHTML = list.map(p=>`
    <div class="product-card">
      <div class="product-img">${p.icon}</div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-brand">${p.brand} · ${p.sku}</div>
        <div class="product-price">${fmtMoney(p.price)}</div>
        <div class="product-stock ${stockClass(p)}">${stockLabel(p)}</div>
        <div class="product-actions">
          <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="showDetail(${p.id})">Ver</button>
          <button class="btn btn-primary btn-sm"   style="flex:1;" onclick="editProduct(${p.id})">Editar</button>
        </div>
      </div>
    </div>`).join('');
}

function showDetail(id) {
  const p = MAGMA.products.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('detail-body').innerHTML = `
    <div style="text-align:center;font-size:4rem;padding:1rem;">${p.icon}</div>
    <div class="grid-2" style="gap:.8rem;">
      <div><div class="form-label">Nombre</div><div class="fw-bold">${p.name}</div></div>
      <div><div class="form-label">SKU</div><div>${p.sku}</div></div>
      <div><div class="form-label">Marca</div><div>${p.brand}</div></div>
      <div><div class="form-label">Categoría</div><div>${p.cat}</div></div>
      <div><div class="form-label">Precio de Venta</div><div class="fw-bold" style="color:#2c7bb6;">${fmtMoney(p.price)}</div></div>
      <div><div class="form-label">Stock Actual</div><div class="${stockClass(p)}">${p.stock} unidades</div></div>
      <div><div class="form-label">Stock Mínimo</div><div>${p.min} unidades</div></div>
      <div><div class="form-label">Estado</div><div>${p.active?'<span class="chip chip-green">Activo</span>':'<span class="chip chip-gray">Inactivo</span>'}</div></div>
    </div>
    <div style="margin-top:1rem;">
      <div class="form-label">Nivel de Stock</div>
      <div style="display:flex;align-items:center;gap:.8rem;margin-top:.4rem;">
        <div style="flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden;">
          <div class="${p.stock<p.min?'bar-low':'bar-ok'}" style="height:100%;width:${Math.min(100,Math.round(p.stock/(p.min*3)*100))}%;border-radius:5px;"></div>
        </div>
        <span class="text-sm text-muted">${p.stock}/${p.min*3}</span>
      </div>
    </div>`;
  openModal('modal-prod-detail');
}

function editProduct(id) {
  const p = MAGMA.products.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('modal-prod-title').textContent = 'Editar Producto';
  document.getElementById('prod-name').value  = p.name;
  document.getElementById('prod-sku').value   = p.sku;
  document.getElementById('prod-brand').value = p.brand;
  document.getElementById('prod-price').value = p.price;
  document.getElementById('prod-stock').value = p.stock;
  openModal('modal-add-prod');
}

function saveProduct() {
  const name = document.getElementById('prod-name').value.trim();
  const sku  = document.getElementById('prod-sku').value.trim();
  if (!name || !sku) { showToast('Completa los campos obligatorios','error'); return; }
  closeModal('modal-add-prod');
  showToast('Producto guardado correctamente','success');
}

// Events
document.addEventListener('DOMContentLoaded', () => {
  renderCats();
  renderProducts();
  document.getElementById('search-prod').addEventListener('input', e => {
    currentSearch = e.target.value; renderProducts();
  });
  document.getElementById('sort-prod').addEventListener('change', e => {
    currentSort = e.target.value; renderProducts();
  });
});
</script>
</body>
</html>

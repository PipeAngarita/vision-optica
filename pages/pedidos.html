<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MagmaSoft – Gestión de Pedidos</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="topbar-placeholder"></div>
<div class="app-shell">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Gestión de Pedidos</div>
        <div class="page-subtitle" id="order-count">Cargando...</div>
      </div>
      <button class="btn btn-primary" onclick="openModal('modal-new-order')">+ Nuevo Pedido</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-order" class="form-control search-input" placeholder="Buscar por N° orden o cliente...">
      </div>
      <select id="filter-status" class="form-control" style="width:auto;">
        <option value="">Todos los estados</option>
        <option>Registrado</option>
        <option>En Proceso</option>
        <option>Listo</option>
        <option>Entregado</option>
        <option>Cancelado</option>
      </select>
    </div>

    <!-- Status tabs -->
    <div class="filter-tabs" id="status-tabs"></div>

    <!-- Table -->
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>N° Orden</th><th>Fecha</th><th>Cliente</th>
              <th>Productos</th><th>Total</th><th>Estado</th>
              <th>Empleado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination" style="padding:.8rem 1rem;"></div>
    </div>
  </main>
</div>
<div id="bottom-nav-placeholder"></div>

<!-- MODAL: New Order -->
<div class="modal-overlay" id="modal-new-order">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Registrar Nuevo Pedido</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Cliente *</label>
        <input type="text" id="order-client" class="form-control" placeholder="Nombre del cliente">
      </div>
      <div class="form-group">
        <label class="form-label">Empleado Responsable</label>
        <select class="form-control">
          <option>J. Angarita</option><option>M. López</option><option>S. Martínez</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Productos</label>
        <div style="border:1.5px solid #dde3ea;border-radius:6px;padding:.8rem;background:#f7fafc;">
          <div id="order-items">
            <div class="form-row" style="margin-bottom:.5rem;">
              <select class="form-control">
                <option value="">Seleccionar producto...</option>
              </select>
              <input type="number" class="form-control" placeholder="Cant." min="1" value="1" style="max-width:80px;">
            </div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="addOrderItem()">+ Agregar producto</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Observaciones</label>
        <textarea class="form-control" rows="2" placeholder="Notas adicionales..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-new-order')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveOrder()">Registrar Pedido</button>
    </div>
  </div>
</div>

<!-- MODAL: Change Status -->
<div class="modal-overlay" id="modal-change-status">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <span class="modal-title">Cambiar Estado de Pedido</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div id="change-status-order-info" style="margin-bottom:1rem;"></div>
      <div class="form-group">
        <label class="form-label">Nuevo Estado *</label>
        <select id="new-status" class="form-control">
          <option>Registrado</option>
          <option>En Proceso</option>
          <option>Listo</option>
          <option>Entregado</option>
          <option>Cancelado</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Observaciones</label>
        <textarea id="status-obs" class="form-control" rows="2" placeholder="Notas del cambio..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-change-status')">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmStatusChange()">Confirmar Cambio</button>
    </div>
  </div>
</div>

<!-- MODAL: Order Detail / Tracking -->
<div class="modal-overlay" id="modal-order-detail">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <span class="modal-title" id="detail-order-id">Detalle de Pedido</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body" id="order-detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-order-detail')">Cerrar</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/components.js"></script>
<script>
let currentStatusFilter = 'Todos';
let currentOrderSearch  = '';
let selectedOrderId     = null;
const PAGE_SIZE = 6;
let currentPage = 1;

function getFiltered() {
  let list = [...MAGMA.orders];
  if (currentStatusFilter !== 'Todos') list = list.filter(o=>o.status===currentStatusFilter);
  if (currentOrderSearch) list = filterList(list, currentOrderSearch, ['id','client']);
  return list;
}

function renderStatusTabs() {
  const counts = {};
  MAGMA.orderStatuses.forEach(s => {
    counts[s] = s==='Todos' ? MAGMA.orders.length : MAGMA.orders.filter(o=>o.status===s).length;
  });
  document.getElementById('status-tabs').innerHTML = MAGMA.orderStatuses.map(s=>`
    <div class="filter-tab ${s===currentStatusFilter?'active':''}" onclick="selectStatus('${s}')">
      ${s} (${counts[s]})
    </div>`).join('');
}

function selectStatus(s) { currentStatusFilter=s; currentPage=1; renderStatusTabs(); renderOrders(); }

function renderOrders() {
  const list = getFiltered();
  const total = list.length;
  const pages = Math.ceil(total/PAGE_SIZE);
  const slice = list.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  document.getElementById('order-count').textContent = `${total} pedido${total!==1?'s':''} encontrado${total!==1?'s':''}`;
  document.getElementById('orders-body').innerHTML = slice.length
    ? slice.map(o=>`
      <tr>
        <td><span class="fw-bold" style="color:#1a3a5c;">${o.id}</span></td>
        <td>${o.date}</td>
        <td>${o.client}</td>
        <td style="color:#888;">${o.items} item${o.items!==1?'s':''}</td>
        <td class="fw-bold">${fmtMoney(o.total)}</td>
        <td>${statusChip(o.status)}</td>
        <td style="color:#888;font-size:.82rem;">${o.employee}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="showOrderDetail('${o.id}')">Ver</button>
          <button class="btn btn-primary btn-sm"   onclick="changeStatus('${o.id}')">Estado</button>
        </td>
      </tr>`).join('')
    : `<tr><td colspan="8" style="text-align:center;padding:2rem;color:#aaa;">No se encontraron pedidos.</td></tr>`;

  // Pagination
  let pg = '';
  if (pages > 1) {
    pg += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for (let i=1;i<=pages;i++) pg += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    pg += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  }
  document.getElementById('pagination').innerHTML = pg;
}

function goPage(p) {
  const pages = Math.ceil(getFiltered().length/PAGE_SIZE);
  if (p<1||p>pages) return;
  currentPage=p; renderOrders();
}

function showOrderDetail(id) {
  const o = MAGMA.orders.find(x=>x.id===id);
  if (!o) return;
  document.getElementById('detail-order-id').textContent = `Pedido ${o.id}`;
  document.getElementById('order-detail-body').innerHTML = `
    <div class="grid-2" style="gap:.8rem;margin-bottom:1.2rem;">
      <div><div class="form-label">Cliente</div><div class="fw-bold">${o.client}</div></div>
      <div><div class="form-label">Fecha</div><div>${o.date}</div></div>
      <div><div class="form-label">Total</div><div class="fw-bold" style="color:#2c7bb6;">${fmtMoney(o.total)}</div></div>
      <div><div class="form-label">Estado</div>${statusChip(o.status)}</div>
      <div><div class="form-label">Empleado</div><div>${o.employee}</div></div>
      <div><div class="form-label">Productos</div><div>${o.items} item${o.items!==1?'s':''}</div></div>
    </div>
    <div class="fw-bold" style="margin-bottom:.7rem;color:#1a3a5c;">Historial de Estados</div>
    <div class="timeline">
      ${MAGMA.orderHistory.map(h=>`
        <div class="tl-item">
          <div class="tl-dot ${h.done?'done':h.current?'current':'pending'}"></div>
          <div class="tl-title">${h.status}</div>
          <div class="tl-date">${h.date} ${h.by!=='—'?`· ${h.by}`:''}</div>
          <div class="tl-desc">${h.note}</div>
        </div>`).join('')}
    </div>`;
  openModal('modal-order-detail');
}

function changeStatus(id) {
  selectedOrderId = id;
  const o = MAGMA.orders.find(x=>x.id===id);
  if (!o) return;
  document.getElementById('change-status-order-info').innerHTML = `
    <div class="alert alert-info">Pedido <b>${o.id}</b> · ${o.client} · Estado actual: ${statusChip(o.status)}</div>`;
  document.getElementById('new-status').value = o.status;
  openModal('modal-change-status');
}

function confirmStatusChange() {
  const newSt = document.getElementById('new-status').value;
  const o = MAGMA.orders.find(x=>x.id===selectedOrderId);
  if (o) { o.status = newSt; }
  closeModal('modal-change-status');
  renderStatusTabs(); renderOrders();
  showToast(`Estado de ${selectedOrderId} actualizado a "${newSt}"`, 'success');
}

function addOrderItem() {
  const container = document.getElementById('order-items');
  const div = document.createElement('div');
  div.className = 'form-row';
  div.style.marginBottom = '.5rem';
  div.innerHTML = `
    <select class="form-control"><option value="">Seleccionar producto...</option>
      ${MAGMA.products.map(p=>`<option>${p.name}</option>`).join('')}
    </select>
    <input type="number" class="form-control" placeholder="Cant." min="1" value="1" style="max-width:80px;">`;
  container.appendChild(div);
}

function saveOrder() {
  const client = document.getElementById('order-client').value.trim();
  if (!client) { showToast('Ingresa el nombre del cliente','error'); return; }
  const newId = `ORD-${String(MAGMA.orders.length+40+1).padStart(4,'0')}`;
  MAGMA.orders.unshift({ id:newId, date:new Date().toLocaleDateString('es-CO'), client, items:1, total:0, status:'Registrado', employee:'J. Angarita' });
  closeModal('modal-new-order');
  renderStatusTabs(); renderOrders();
  showToast(`Pedido ${newId} registrado correctamente`, 'success');
}

document.addEventListener('DOMContentLoaded', () => {
  // Populate product options
  const selects = document.querySelectorAll('#order-items select');
  selects.forEach(s => {
    s.innerHTML = '<option value="">Seleccionar...</option>' + MAGMA.products.map(p=>`<option>${p.name}</option>`).join('');
  });

  renderStatusTabs();
  renderOrders();

  document.getElementById('search-order').addEventListener('input', e => {
    currentOrderSearch = e.target.value; currentPage=1; renderOrders();
  });
  document.getElementById('filter-status').addEventListener('change', e => {
    currentStatusFilter = e.target.value || 'Todos'; currentPage=1; renderStatusTabs(); renderOrders();
  });
});
</script>
</body>
</html>
